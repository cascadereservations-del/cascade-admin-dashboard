# Builds the new admin and uploads the build output as a CI artifact for
# inspection. Publishing is a manual step (dist/ copied to the repo root and
# next/, then committed) - this job never deploys. Legacy entry points
# (legacy/index.html, legacy/index2.html) are committed directly in the repo
# since the D-110 cutover, not generated from this build.
name: Build admin (dist only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist
